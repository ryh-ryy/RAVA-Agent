<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10375C"/><stop offset="1" stop-color="#1F5B89"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324D" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#547187"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#138A9C"/></marker>
    <style>
      .title { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 35px; font-weight: 700; fill: #102D48; }
      .subtitle { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 18px; fill: #50687B; }
      .label { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 21px; font-weight: 700; fill: #17324D; }
      .small { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 16px; fill: #365369; }
      .micro { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 14px; fill: #365369; }
      .white { font-family: Arial, 'Microsoft YaHei', sans-serif; fill: #fff; font-size: 20px; font-weight: 700; }
      .tag { font-family: Arial, 'Microsoft YaHei', sans-serif; fill: #fff; font-size: 15px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F8FBFD"/>
  <rect x="0" y="0" width="1600" height="18" fill="url(#header)"/>
  <text x="72" y="78" class="title">RAVA-Agent: Auditable Risk-Aware Evidence Verification</text>
  <text x="72" y="110" class="subtitle">A frozen policy selects direct answer, evidence retrieval, verification, or conservative handoff; every action is logged.</text>

  <!-- input -->
  <g filter="url(#shadow)">
    <rect x="72" y="206" rx="18" ry="18" width="245" height="145" fill="#FFFFFF" stroke="#B8CBD8" stroke-width="2"/>
    <rect x="72" y="206" rx="18" ry="18" width="245" height="42" fill="#315F83"/>
    <text x="194" y="234" text-anchor="middle" class="white">Medical query</text>
    <text x="194" y="286" text-anchor="middle" class="label">x</text>
    <text x="194" y="316" text-anchor="middle" class="small">Question / case context</text>
  </g>

  <!-- arrows -->
  <path d="M318 278 H390" stroke="#547187" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- router -->
  <g filter="url(#shadow)">
    <rect x="400" y="171" rx="20" ry="20" width="315" height="214" fill="#FFFFFF" stroke="#138A9C" stroke-width="3"/>
    <rect x="400" y="171" rx="20" ry="20" width="315" height="48" fill="#138A9C"/>
    <text x="557" y="202" text-anchor="middle" class="white">1. Frozen risk router P</text>
    <text x="557" y="254" text-anchor="middle" class="label">Route(x) → r ∈ {low, medium, high}</text>
    <rect x="430" y="282" rx="12" ry="12" width="66" height="34" fill="#48A868"/><text x="463" y="305" text-anchor="middle" class="tag">LOW</text>
    <rect x="524" y="282" rx="12" ry="12" width="81" height="34" fill="#E59B32"/><text x="565" y="305" text-anchor="middle" class="tag">MEDIUM</text>
    <rect x="631" y="282" rx="12" ry="12" width="54" height="34" fill="#C94A4A"/><text x="658" y="305" text-anchor="middle" class="tag">HIGH</text>
    <text x="557" y="347" text-anchor="middle" class="small">Fixed terms and thresholds; versioned policy</text>
  </g>

  <!-- decision arrows -->
  <path d="M716 239 H806 V191 H875" stroke="#547187" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="776" y="178" text-anchor="middle" class="micro">low / no verification</text>
  <path d="M716 320 H780 V502 H875" stroke="#138A9C" stroke-width="4" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="776" y="485" text-anchor="middle" class="micro">medium / high</text>

  <!-- direct -->
  <g filter="url(#shadow)">
    <rect x="885" y="126" rx="18" ry="18" width="268" height="130" fill="#FFFFFF" stroke="#7894A9" stroke-width="2"/>
    <rect x="885" y="126" rx="18" ry="18" width="268" height="42" fill="#7894A9"/>
    <text x="1019" y="154" text-anchor="middle" class="white">2A. Direct answer</text>
    <text x="1019" y="204" text-anchor="middle" class="label">LLM(x)</text>
    <text x="1019" y="231" text-anchor="middle" class="small">One model call</text>
  </g>
  <path d="M1154 191 H1238" stroke="#547187" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- retrieve -->
  <g filter="url(#shadow)">
    <rect x="885" y="426" rx="18" ry="18" width="268" height="151" fill="#FFFFFF" stroke="#138A9C" stroke-width="2"/>
    <rect x="885" y="426" rx="18" ry="18" width="268" height="42" fill="#138A9C"/>
    <text x="1019" y="454" text-anchor="middle" class="white">2B. Retrieve evidence</text>
    <text x="1019" y="502" text-anchor="middle" class="label">Retrieve(e)</text>
    <text x="1019" y="531" text-anchor="middle" class="small">Public, versioned evidence store</text>
    <text x="1019" y="555" text-anchor="middle" class="micro">No benchmark answers in the store</text>
  </g>
  <path d="M1154 501 H1238" stroke="#138A9C" stroke-width="4" fill="none" marker-end="url(#arrowTeal)"/>

  <!-- decisions output block -->
  <g filter="url(#shadow)">
    <rect x="1248" y="113" rx="22" ry="22" width="275" height="510" fill="#FFFFFF" stroke="#A8BAC8" stroke-width="2"/>
    <rect x="1248" y="113" rx="22" ry="22" width="275" height="48" fill="#10375C"/>
    <text x="1386" y="145" text-anchor="middle" class="white">3. Select action</text>
    <rect x="1273" y="188" rx="12" ry="12" width="225" height="86" fill="#EEF4F8"/>
    <text x="1386" y="219" text-anchor="middle" class="label">Output(y)</text>
    <text x="1386" y="247" text-anchor="middle" class="small">Direct answer / final option</text>
    <rect x="1273" y="305" rx="12" ry="12" width="225" height="105" fill="#E4F5F6"/>
    <text x="1386" y="336" text-anchor="middle" class="label">Verify(v)</text>
    <text x="1386" y="364" text-anchor="middle" class="small">LLM(x, retrieved evidence)</text>
    <text x="1386" y="387" text-anchor="middle" class="micro">When policy permits verification</text>
    <rect x="1273" y="441" rx="12" ry="12" width="225" height="134" fill="#FFF1EF"/>
    <text x="1386" y="473" text-anchor="middle" class="label">Conservative handoff(h)</text>
    <text x="1386" y="501" text-anchor="middle" class="small">No evidence / policy-triggered</text>
    <text x="1386" y="526" text-anchor="middle" class="small">Escalate to human review</text>
    <text x="1386" y="551" text-anchor="middle" class="micro">No clinical claim implied</text>
  </g>

  <!-- arrows to actions -->
  <path d="M1154 501 H1200 V357 H1272" stroke="#138A9C" stroke-width="4" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M1154 501 H1200 V507 H1272" stroke="#C94A4A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- audit rail -->
  <path d="M194 350 V710 H1318" stroke="#5C7A91" stroke-width="3" stroke-dasharray="10 9" fill="none" marker-end="url(#arrow)"/>
  <text x="205" y="689" class="micro">all paths emit trace fields</text>
  <g filter="url(#shadow)">
    <rect x="444" y="660" rx="18" ry="18" width="704" height="143" fill="#EFF5F8" stroke="#55748A" stroke-width="2"/>
    <rect x="444" y="660" rx="18" ry="18" width="704" height="42" fill="#55748A"/>
    <text x="796" y="688" text-anchor="middle" class="white">4. Immutable audit trail Log(l)</text>
    <text x="796" y="739" text-anchor="middle" class="label">route · matched_policy_terms · evidence_count · verification_used</text>
    <text x="796" y="770" text-anchor="middle" class="small">action · handoff_reason · final output · API-call count · elapsed time · policy version</text>
  </g>
  <text x="72" y="855" class="subtitle">Engineering interpretation: the diagram specifies transparent action selection and logging. Clinical correctness, routing validity, and safety require independent expert evaluation.</text>
</svg>
